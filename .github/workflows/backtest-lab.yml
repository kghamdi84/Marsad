name: Backtest lab

# Runs every playbook rule through the backtester on stored bars each Sunday and by hand (ADR 0018): stores new rule
# versions, backtest runs with their reports, and moves a draft to backtested only when the out-of-sample gate
# passes. Reads only the database.
on:
  schedule:
    - cron: '20 6 * * 0' # 06:20 UTC Sundays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-lab
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the backtests
        run: pnpm --filter @marsad/jobs backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
