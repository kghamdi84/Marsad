name: Backtest lab

# Runs every playbook rule through the backtester on stored bars each Sunday and by hand (ADR 0018): stores new rule
# versions, backtest runs with their reports, and moves a draft to backtested only when the out-of-sample gate
# passes. Reads only the database.
on:
  schedule:
    - cron: '20 6 * * 0' # 06:20 UTC Sundays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-lab
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the backtests
        run: pnpm --filter @marsad/jobs backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
