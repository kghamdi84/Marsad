name: Massive news topics

# Counts geopolitical topics in market-wide news for each complete UTC day (ADR 0012): one or two calls a day after
# the first run, which fills 35 days (about 40 calls, under 10 minutes). Shares the massive-api concurrency group.
on:
  schedule:
    - cron: '20 1 * * *' # 01:20 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api
  cancel-in-progress: false

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        run: pnpm --filter @marsad/jobs massive topics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
