name: Web Push

# The Web Push dispatcher (ADR 0031). It normally runs as the last step of every workflow that can create an
# alert, a system alert or a brief (halts every 5 minutes on weekdays, health, bars, briefs, the weekly review),
# so it has no schedule of its own and adds no extra runs. Run it here by hand to send pending items now, or with
# "Send a test notification" set to true to check that every device receives one.
on:
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Send push notifications
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
          PUSH_TEST: ${{ inputs.test && '1' || '0' }}
