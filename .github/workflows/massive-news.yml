name: Massive news

# Stores the 30 newest articles for each tracked ticker three times a weekday (12:05, 15:05 and 18:05 UTC). The free plan allows about 5 calls a minute, so the run takes a few minutes. Shares the massive-api concurrency group with every other Massive workflow.
on:
  schedule:
    - cron: '5 12,15,18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        run: pnpm --filter @marsad/jobs massive news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
