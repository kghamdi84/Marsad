name: Massive news

# Stores the 30 newest articles for each tracked ticker three times a weekday (12:05, 15:05 and 18:05 UTC). The free plan allows about 5 calls a minute, so the run takes a few minutes. Shares the massive-api concurrency group with every other Massive workflow.
on:
  schedule:
    - cron: '5 12,15,18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        run: pnpm --filter @marsad/jobs massive news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
