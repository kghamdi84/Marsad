name: Weekly SEC data

# Weekly jobs on free SEC data. The quality-at-a-discount screen (ADR 0035): SEC XBRL frames for the Marsad
# universe, about 16 requests. The 13F holders (ADR 0037): the newest SEC Form 13F data set (about 100 MB),
# downloaded only when it is new. ETF holdings (ADR 0038): the newest N-PORT report of SPY, QQQ and DIA, each
# downloaded once. Sunday after the weekly exports; run by hand any time.
on:
  schedule:
    - cron: '41 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-api # shares the SEC fair-access limit with the other SEC workflows
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the quality screen
        run: pnpm --filter @marsad/jobs quality
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Read 13F holders
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs holders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Read ETF holdings (N-PORT)
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs etf
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
