name: Quality screen

# Weekly quality-at-a-discount screen (ADR 0035): SEC XBRL frames (free, public) for the Marsad universe, ranked
# by quality and value. About 16 SEC requests a run. Sunday after the weekly exports; run by hand any time.
on:
  schedule:
    - cron: '41 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-screen
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the quality screen
        run: pnpm --filter @marsad/jobs quality
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
