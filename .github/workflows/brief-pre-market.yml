name: Pre-market brief

# The pre-market brief, about 60 minutes before the US open. Both times fire on weekdays; the job runs only
# inside its window (12:30 UTC in summer time, 13:30 UTC in winter) and skips holidays (ADR 0015). Reads only stored data. Emails the brief when the RESEND_API_KEY and
# BRIEF_EMAIL_TO secrets exist; otherwise stores it (shown on the Watch page) and records "not-configured".
on:
  schedule:
    - cron: '30 12 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brief-pre-market
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, store and send the brief
        run: pnpm --filter @marsad/jobs brief pre-market
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
          BRIEF_MINUTES_BEFORE_OPEN: ${{ vars.BRIEF_MINUTES_BEFORE_OPEN }}
      - name: Send push notifications
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
