name: Tauric research

# Company research (ADR 0047): analyst consensus, profile, Tauric AI thesis and earnings calendar for every
# holding and watchlist ticker, written to public.company_research. Daily at 09:35 UTC Tuesday to Saturday: after
# each US session's close and Tauric's overnight refresh (analyst and profile data refreshed about 00:30 to 01:50
# UTC, theses written about 08:20 to 08:35 UTC on 2026-11-28), and before the next open. At most 4 data credits a
# ticker and 300 a run, read against the account's 3,000 a day before spending. GitHub's scheduler can run late.
# Until the TAURIC_API_KEY repository secret exists, every run ends at the first step without failing.
on:
  schedule:
    - cron: '35 9 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauric-api
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.TAURIC_API_KEY != '' }}
    steps:
      - name: Waiting for the TAURIC_API_KEY secret
        if: ${{ env.HAS_KEY != 'true' }}
        run: echo "TAURIC_API_KEY is not set; nothing to do (ADR 0047)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.HAS_KEY == 'true' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ env.HAS_KEY == 'true' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ env.HAS_KEY == 'true' }}
      - name: Run the research job
        if: ${{ env.HAS_KEY == 'true' }}
        run: pnpm --filter @marsad/jobs tauric research
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAURIC_API_KEY: ${{ secrets.TAURIC_API_KEY }}
