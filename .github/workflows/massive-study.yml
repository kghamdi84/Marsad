name: Massive short data and dividends

# Stores short interest, short volume and dividends for each tracked ticker after the close (23:15 UTC on weekdays; the bars job runs at 22:30). Three calls per ticker at about 5 calls a minute, so the run takes about 10 minutes. Shares the massive-api concurrency group.
on:
  schedule:
    - cron: '15 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        run: pnpm --filter @marsad/jobs massive study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
