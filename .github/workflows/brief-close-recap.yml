name: Close recap

# The close recap at 22:50 UTC on weekdays, after the bars job (22:30 UTC); skips holidays (ADR 0015). Reads only stored data. Emails the brief when the RESEND_API_KEY and
# BRIEF_EMAIL_TO secrets exist; otherwise stores it (shown on the Watch page) and records "not-configured".
on:
  schedule:
    - cron: '50 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brief-close-recap
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, store and send the brief
        run: pnpm --filter @marsad/jobs brief close-recap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
          BRIEF_MINUTES_BEFORE_OPEN: ${{ vars.BRIEF_MINUTES_BEFORE_OPEN }}
