name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # The main entry chunk must stay within apps/web/bundle-budget.mjs (ADR 0053).
      - name: Bundle budget
        run: node apps/web/scripts/check-bundle.mjs
      - run: pnpm --filter @marsad/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # The same core must run in Supabase Edge Functions (Deno). This builds the generated copy exactly as the
  # deploy step does, type-checks it under Deno's strict mode and requires byte-identical results from Node
  # and Deno (docs/adr/0004-deployment.md).
  edge-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-edge-core.mjs
      - run: deno check supabase/functions/_shared/core/index.ts
      # The Ask Edge Function (ADR 0054) against the same copy, with its pinned npm imports.
      - run: deno check --config supabase/functions/ask/deno.json supabase/functions/ask/index.ts
      - name: Run the same calculations under Node and Deno
        run: |
          pnpm --filter @marsad/jobs exec tsx ../scripts/edge-parity.mjs ../packages/core/src/index.ts > "$RUNNER_TEMP/node.json"
          deno run -A --no-lock scripts/edge-parity.mjs supabase/functions/_shared/core/index.ts > "$RUNNER_TEMP/deno.json"
          test -s "$RUNNER_TEMP/node.json"
          cmp "$RUNNER_TEMP/node.json" "$RUNNER_TEMP/deno.json"
