name: Reconcile nightly

# Cross-checks Massive Treasury yields against FRED. A mismatch fails the run and is recorded on the status page.
on:
  schedule:
    - cron: '45 0 * * *' # 00:45 UTC daily, after the FRED job (23:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api # one group for every workflow that uses the Massive key (about 5 calls a minute)
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the reconciliation
        run: pnpm --filter @marsad/jobs massive reconcile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
