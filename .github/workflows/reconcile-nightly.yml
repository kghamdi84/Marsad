name: Reconcile nightly

# Cross-checks Massive Treasury yields against FRED. A mismatch fails the run and is recorded on the status page.
on:
  schedule:
    - cron: '45 0 * * *' # 00:45 UTC daily, after the FRED job (23:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api # one group for every workflow that uses the Massive key (about 5 calls a minute)
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the reconciliation
        run: pnpm --filter @marsad/jobs massive reconcile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
