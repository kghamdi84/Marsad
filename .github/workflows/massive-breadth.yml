name: Massive universe breadth

# Stores each session's whole-market snapshot (one call a day) and recomputes the Marsad universe and its breadth
# (ADR 0010). Runs on weekday mornings, when the previous session is complete. The first run fills 2 years of history:
# about 520 sessions plus ticker lists, about 2 hours at 5 calls a minute; it resumes where it stopped if it fails.
# Shares the massive-api concurrency group, so other Massive jobs wait while it runs.
on:
  schedule:
    - cron: '40 10 * * 2-6' # 10:40 UTC, Tuesday to Saturday (after Monday to Friday sessions)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api
  cancel-in-progress: false

jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        run: pnpm --filter @marsad/jobs massive breadth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          # Massive Stocks Starter has no call limit (2026-11-28); the job default is the free 5 a minute.
          MASSIVE_CALLS_PER_MINUTE: 60
      - name: Recompute the Fear and Greed composite and the capitulation watch
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs sentiment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
