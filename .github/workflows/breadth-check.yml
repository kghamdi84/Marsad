name: Breadth spot check

# One-off check for checklist 3.3: the breadth-1 share above the 200- and 50-day averages over SPY's N-PORT holdings
# (the S&P 500), from the stored daily snapshots, to compare with published S&P 500 breadth. Read only; writes
# nothing. Run by hand only (no schedule).
on:
  workflow_dispatch:
    inputs:
      dates:
        description: Dates to check, comma separated (YYYY-MM-DD)
        type: string
        default: 2026-11-24,2026-11-25,2026-11-27

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the check
        run: pnpm --filter @marsad/jobs breadth-check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHECK_DATES: ${{ inputs.dates }}
