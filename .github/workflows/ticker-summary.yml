name: Ticker summary

# The nightly per-ticker summary (ADR 0050, formula ticker-summary-1): one row per holding, watchlist ticker, SPY and
# sector fund in public.ticker_daily_summary, computed from stored data only (no vendor calls). Runs at 11:25 UTC
# Tuesday to Saturday: after the bars job (22:30 UTC the evening before), the company research job (09:35 UTC) and
# the breadth job (10:40 UTC), and before the 13:30 UTC open. GitHub's scheduler can run late; Supabase Cron starts it
# on time (ADR 0008). Idempotent: a second run the same day rewrites the same rows. Then the earnings guard (ADR 0052)
# and the Web Push dispatcher run, so its alerts go out in this run.
on:
  schedule:
    - cron: '25 11 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticker-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the job
        run: pnpm --filter @marsad/jobs ticker-summary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # The earnings guard (ADR 0052): one factual alert per holding whose next results date is within 5 trading
      # sessions, through the alert pipeline. After the research job (09:35 UTC) and the summary step. Runs even when
      # the summary step failed: it reads the research and estimate tables itself, and names a stale source instead
      # of skipping it silently.
      - name: Check holdings' next results dates
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs earnings-guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Send push notifications
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
