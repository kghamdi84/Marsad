name: SEC filings

# Stores each watchlist company's recent SEC filings. Declares a contact in the User-Agent, as the SEC requires
# (secret SEC_USER_AGENT), and stays far below the SEC's limit of 10 requests a second.
on:
  schedule:
    - cron: '7,37 11-23 * * 1-5' # twice an hour, 11:00 to 23:59 UTC on weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-filings
  cancel-in-progress: false

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the SEC job
        run: pnpm --filter @marsad/jobs sec
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
