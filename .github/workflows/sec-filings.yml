name: SEC filings

# Stores each watchlist company's recent SEC filings. Declares a contact in the User-Agent, as the SEC requires
# (secret SEC_USER_AGENT), and stays far below the SEC's limit of 10 requests a second.
on:
  schedule:
    - cron: '7,37 11-23 * * 1-5' # twice an hour, 11:00 to 23:59 UTC on weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-api # one group for every workflow that calls the SEC (fair access: 10 requests a second)
  cancel-in-progress: false

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the SEC job
        run: pnpm --filter @marsad/jobs sec
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Read new 10-Q risk-factor sections
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs sec tenq
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
