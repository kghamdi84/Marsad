name: FRED daily

# Downloads the FRED series Marsad uses and stores them in Supabase, then recomputes the regime label and the
# recession filter from them (ADR 0009), then the Fear and Greed composite and the capitulation watch (ADR 0011).
# The later steps run even if a FRED series failed; each fails loudly itself when its newest input is more than
# 5 days old.
on:
  schedule:
    - cron: '30 23 * * *' # 23:30 UTC daily, after FRED's evening updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fred-daily
  cancel-in-progress: false

jobs:
  fred:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the FRED job
        run: pnpm --filter @marsad/jobs fred
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Recompute the regime from the stored series
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs regime
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Recompute the Fear and Greed composite and the capitulation watch
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs sentiment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Refresh the economic and earnings calendars
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs calendar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
