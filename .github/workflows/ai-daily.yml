name: AI daily

# Claude summaries of each holding's and watchlist company's newest stored filings (checklist 2.9, ADR 0007), then a
# thesis card draft for each open holding without a saved thesis (checklist 2.10). Reads
# only the database (filings, 10-K and 10-Q risk factor sections and XBRL facts the SEC and sections jobs stored);
# writes public.ai_outputs and logs every call in public.ai_usage. Runs at 00:50 UTC Tuesday to Saturday, after the
# SEC filings job's last weekday run (23:37 UTC) and its 10-Q step. A company is summarized again only when its
# sources change, so most runs make no call. Caps: USD 1 a day and USD 10 a month (ADR 0007 addendum); without the
# ANTHROPIC_API_KEY secret the run records skipped and spends nothing. Supabase Cron starts it on time (ADR 0008).
on:
  schedule:
    - cron: '50 0 * * 2-6'
  workflow_dispatch:
    inputs:
      thesis_for:
        description: 'Draft a thesis card for these tickers too, comma separated (optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Summarize new filings
        run: pnpm --filter @marsad/jobs ai-summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Drafts are offered on the thesis card as a starting point; saving is always Khaled's own edit in the form.
      - name: Draft thesis cards
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs ai-thesis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_THESIS_TICKERS: ${{ inputs.thesis_for }}
