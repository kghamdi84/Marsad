name: Deploy Edge Functions

# Manual. Deploys the Edge Functions in supabase/functions (today: `ask`, ADR 0054). Migrations are deployed by the
# Supabase GitHub integration, not by this workflow (docs/adr/0004-deployment.md). Needs one repository secret,
# SUPABASE_ACCESS_TOKEN (Supabase: Account, Access Tokens). The project reference is public. The functions' own
# secrets (ANTHROPIC_API_KEY) live in Supabase (Edge Functions, Secrets), never here.
on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy (a folder name in supabase/functions)'
        required: true
        default: ask

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: hwdwivilqdydmxhycapy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # This job never runs pnpm; without this, setup-node reads packageManager and fails looking for pnpm.
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - name: Check the token and the function name
        env:
          FUNCTION: ${{ inputs.function }}
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (docs/SETUP.md, step 6)."
            exit 1
          fi
          case "$FUNCTION" in _*|*/*|'') echo "::error::Not a function folder: $FUNCTION"; exit 1 ;; esac
          test -f "supabase/functions/$FUNCTION/index.ts" || { echo "::error::No supabase/functions/$FUNCTION/index.ts"; exit 1; }
      - name: Copy the shared core into the functions folder
        run: node scripts/prepare-edge-core.mjs
      - name: Type-check the function under Deno
        env:
          FUNCTION: ${{ inputs.function }}
        run: deno check --config "supabase/functions/$FUNCTION/deno.json" "supabase/functions/$FUNCTION/index.ts"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest
      - name: Deploy
        env:
          FUNCTION: ${{ inputs.function }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF" --use-api
