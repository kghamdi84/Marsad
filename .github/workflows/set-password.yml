name: Set password

# Sets the password of the one Marsad account (ADR 0039) from the MARSAD_PASSWORD secret, through the Supabase
# admin API, so no email is sent. Run by hand after adding or changing that secret. The password never appears in
# the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-password:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the password
        run: pnpm --filter @marsad/jobs set-password
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MARSAD_PASSWORD: ${{ secrets.MARSAD_PASSWORD }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
