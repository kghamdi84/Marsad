name: Nasdaq halts

# Stores the Nasdaq trade-halts feed. Runs every 5 minutes around US trading hours (04:00 to 20:00 ET covers
# 08:00 to 01:00 UTC across both daylight saving settings; the run starts at 07:00 UTC so the heartbeat never
# meets a 6-hour overnight gap when summer pre-market opens at 08:00 UTC). One request per run, far below the agreed floor of
# one request per 30 seconds. GitHub's scheduler can run late; Phase 5 replaces this with a 30 second poller.
on:
  schedule:
    - cron: '*/5 7-23 * * 1-5'
    - cron: '*/5 0-1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasdaq-halts
  cancel-in-progress: false

jobs:
  halts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the halts job
        run: pnpm --filter @marsad/jobs halts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Turn halts in watched tickers into alerts
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs alerts-halts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Send push notifications
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
