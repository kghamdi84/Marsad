name: GPR daily

# Downloads the Geopolitical Risk Index and stores it in Supabase. See docs/adr/0006-gpr-ingestion.md.
on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpr-daily
  cancel-in-progress: false

jobs:
  gpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd
      - run: pnpm install --frozen-lockfile
      - name: Run the GPR job
        run: pnpm --filter @marsad/jobs gpr
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
