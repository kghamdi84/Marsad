name: Heartbeat

# Judges every data source against its silence limit and records a system alert when one goes stale or
# recovers. Runs every 15 minutes around US trading hours (same window as the halts job) and every 3 hours
# otherwise, so slow daily feeds are also watched. GitHub's scheduler can run late; if this workflow fails,
# GitHub emails the repository owner, which is the only outside signal Phase 1 has for a dead heartbeat.
on:
  schedule:
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the heartbeat
        run: pnpm --filter @marsad/jobs health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Send push notifications
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
