name: Heartbeat

# Judges every data source against its silence limit and records a system alert when one goes stale or
# recovers. Runs every 15 minutes around US trading hours (same window as the halts job) and every 3 hours
# otherwise, so slow daily feeds are also watched. GitHub's scheduler can run late; if this workflow fails,
# GitHub emails the repository owner, which is the only outside signal Phase 1 has for a dead heartbeat.
on:
  schedule:
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the heartbeat
        run: pnpm --filter @marsad/jobs health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
