name: Heartbeat

# Judges every data source against its silence limit and records a system alert when one goes stale or
# recovers. Runs every 15 minutes around US trading hours (same window as the halts job) and every 3 hours
# otherwise, so slow daily feeds are also watched. GitHub's scheduler can run late; if this workflow fails,
# GitHub emails the repository owner, which is the only outside signal Phase 1 has for a dead heartbeat.
on:
  schedule:
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the heartbeat
        run: pnpm --filter @marsad/jobs health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Send push notifications
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
