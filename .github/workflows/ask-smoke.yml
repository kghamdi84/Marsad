name: Ask smoke test

# One question to the deployed `ask` Edge Function, signed in as the one Marsad account with the MARSAD_PASSWORD
# secret (checklist 8.1; Khaled approved this test on 2026-11-28). It spends a few cents of the approved Anthropic
# caps (USD 1 a day, USD 10 a month; Ask checks them itself). The default question is about SPY, not his holdings.
# Run by hand only.
on:
  workflow_dispatch:
    inputs:
      question:
        description: Question to ask (500 characters at most; keep it about public data, the log is kept)
        type: string
        default: What is the latest stored daily close for SPY, and as of what date?

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ask one question
        run: pnpm --filter @marsad/jobs ask-smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MARSAD_PASSWORD: ${{ secrets.MARSAD_PASSWORD }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
          ASK_QUESTION: ${{ inputs.question }}
