name: Record fixtures

# Manual only. Calls a few live endpoints once and prints trimmed responses to the log so real bodies can be
# saved under fixtures/. Prints response bodies only (never keys or headers); logs of a public repository are
# public, so only public data may be added here.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Which recorder to run
        type: choice
        default: record-fixtures-main.ts
        options:
          - record-fixtures-main.ts
          - record-study-main.ts
          - record-sections-main.ts
          - record-holdings-main.ts
          - record-breadth-main.ts
          - record-calendar-main.ts
          - record-frames-main.ts

permissions:
  contents: read

concurrency:
  # The Massive recorders share the massive-api group (about 5 calls a minute); the FRED-only recorder does not.
  group: ${{ (inputs.script == 'record-calendar-main.ts' || inputs.script == 'record-frames-main.ts') && 'record-public' || 'massive-api' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record
        run: pnpm --filter @marsad/jobs exec tsx "src/$RECORDER"
        env:
          RECORDER: ${{ inputs.script }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
