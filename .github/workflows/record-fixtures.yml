name: Record fixtures

# Manual only. Calls a few live endpoints once and prints trimmed responses to the log so real bodies can be
# saved under fixtures/. Prints response bodies only (never keys or headers); logs of a public repository are
# public, so only public data may be added here.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Which recorder to run
        type: choice
        default: record-fixtures-main.ts
        options:
          - record-fixtures-main.ts
          - record-study-main.ts
          - record-sections-main.ts
          - record-holdings-main.ts
          - record-breadth-main.ts
          - record-calendar-main.ts
          - record-frames-main.ts
          - record-10q-main.ts
          - record-13f-main.ts
          - record-nport-main.ts

permissions:
  contents: read

concurrency:
  # The Massive recorders share the massive-api group (about 5 calls a minute); the FRED-only recorder does not.
  group: ${{ (inputs.script == 'record-calendar-main.ts' || inputs.script == 'record-frames-main.ts' || inputs.script == 'record-10q-main.ts' || inputs.script == 'record-13f-main.ts' || inputs.script == 'record-nport-main.ts') && 'record-public' || 'massive-api' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record
        run: pnpm --filter @marsad/jobs exec tsx "src/$RECORDER"
        env:
          RECORDER: ${{ inputs.script }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
