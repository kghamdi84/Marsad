name: Record fixtures

# Manual only. Calls a few live endpoints once and prints trimmed responses to the log so real bodies can be
# saved under fixtures/. Prints response bodies only (never keys or headers); logs of a public repository are
# public, so only public data may be added here.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Which recorder to run
        type: choice
        default: record-fixtures-main.ts
        options:
          - record-fixtures-main.ts
          - record-study-main.ts
          - record-sections-main.ts
          - record-holdings-main.ts
          - record-breadth-main.ts

permissions:
  contents: read

concurrency:
  group: massive-api # one group for every workflow that uses the Massive key (about 5 calls a minute)
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record
        run: pnpm --filter @marsad/jobs exec tsx "src/$RECORDER"
        env:
          RECORDER: ${{ inputs.script }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
