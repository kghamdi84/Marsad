name: Massive daily bars

# Stores two years of daily bars for the tracked tickers after the US close (16:00 ET is 20:00 or 21:00 UTC;
# 22:30 UTC is after the close in both daylight saving settings). The free Massive plan allows about 5 calls a
# minute, so the job spreads its calls out and takes a few minutes. It shares the massive-api concurrency
# group with every other Massive workflow so two runs never overlap.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: massive-api
  cancel-in-progress: false

jobs:
  bars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the bars job
        run: pnpm --filter @marsad/jobs massive bars
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      # Exit rules (stop, targets, trend break, time stop) on the bars just stored, through the alert pipeline.
      # Runs even when the bars step failed, so a holding with stale bars is named instead of skipped silently.
      - name: Check exit rules on open holdings
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs alerts-exits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # The scorecard: each recent alert's outcome after 1, 5 and 20 sessions, from the bars just stored.
      - name: Score recent alerts
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs scorecard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # The catalyst watch: Khaled's scenarios against the day's filings, Form 4s, news, halts and moves.
      - name: Check catalyst scenarios
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs catalyst
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Send push notifications
        if: ${{ !cancelled() }}
        run: pnpm --filter @marsad/jobs push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_EMAIL_TO: ${{ secrets.BRIEF_EMAIL_TO }}
